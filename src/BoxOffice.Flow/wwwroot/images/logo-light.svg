<?xml version="1.0" encoding="UTF-8"?>
<svg width="70" height="58" viewBox="12 18 70 58" xmlns="http://www.w3.org/2000/svg">
  <!--
    BoxOffice Flow — light mode logo
    Ticket silhouette: rounded rect with a semicircular notch on the left edge
    (classic perforated tear line). Double chevron inside for "flow".
    Used on white / light surfaces.
  -->

  <!-- Ticket body (clockwise path, notch arc counter-clockwise) -->
  <path
    d="M 24,18 L 70,18
       A 12,12 0 0,1 82,30
       L 82,64
       A 12,12 0 0,1 70,76
       L 24,76
       A 12,12 0 0,1 12,64
       L 12,57
       A 10,10 0 0,0 12,37
       L 12,30
       A 12,12 0 0,1 24,18 Z"
    fill="#4F63D2"/>

  <!-- Perforation / tear line -->
  <line x1="34" y1="20" x2="34" y2="74"
        stroke="white" stroke-width="1.5"
        stroke-dasharray="3.5,2.5" stroke-opacity="0.45"
        stroke-linecap="round"/>

  <!-- Stub info lines (left section) -->
  <line x1="17" y1="39" x2="29" y2="39"
        stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="17" y1="47" x2="29" y2="47"
        stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="17" y1="55" x2="29" y2="55"
        stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Primary flow chevron -->
  <polyline points="45,37 57,47 45,57"
            fill="none" stroke="white" stroke-width="4.5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Secondary flow chevron (echo / motion trail) -->
  <polyline points="55,37 67,47 55,57"
            fill="none" stroke="white" stroke-width="4.5"
            stroke-linecap="round" stroke-linejoin="round"
            stroke-opacity="0.38"/>
</svg>
