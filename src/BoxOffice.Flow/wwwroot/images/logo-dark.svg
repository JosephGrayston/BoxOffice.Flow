<?xml version="1.0" encoding="UTF-8"?>
<svg width="94" height="94" viewBox="0 0 94 94" xmlns="http://www.w3.org/2000/svg">
  <!--
    BoxOffice Flow — dark mode logo
    Same ticket + double-chevron mark, lighter indigo fill (#7B8EF8)
    for dark surfaces. Interior details use deep indigo for contrast.
    Used on dark / #0E1120 surfaces.
  -->

  <!-- Ticket body -->
  <path
    d="M 24,18 L 70,18
       A 12,12 0 0,1 82,30
       L 82,64
       A 12,12 0 0,1 70,76
       L 24,76
       A 12,12 0 0,1 12,64
       L 12,57
       A 10,10 0 0,0 12,37
       L 12,30
       A 12,12 0 0,1 24,18 Z"
    fill="#7B8EF8"/>

  <!-- Perforation / tear line -->
  <line x1="34" y1="20" x2="34" y2="74"
        stroke="#0F1120" stroke-width="1.5"
        stroke-dasharray="3.5,2.5" stroke-opacity="0.38"
        stroke-linecap="round"/>

  <!-- Stub info lines (left section) -->
  <line x1="17" y1="39" x2="29" y2="39"
        stroke="#0F1120" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="17" y1="47" x2="29" y2="47"
        stroke="#0F1120" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="17" y1="55" x2="29" y2="55"
        stroke="#0F1120" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Primary flow chevron -->
  <polyline points="45,37 57,47 45,57"
            fill="none" stroke="#0F1120" stroke-width="4.5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Secondary flow chevron (echo / motion trail) -->
  <polyline points="55,37 67,47 55,57"
            fill="none" stroke="#0F1120" stroke-width="4.5"
            stroke-linecap="round" stroke-linejoin="round"
            stroke-opacity="0.32"/>
</svg>
